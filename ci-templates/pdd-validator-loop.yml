name: pdd-validator-loop
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pdd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env: { PDD_EVIDENCE_KEY: ${{ secrets.PDD_EVIDENCE_KEY }} }
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.3 pytest==9.0.3 hypothesis==6.165.0 jsonschema==4.26.0
      - name: Bundle lint
        run: for d in pdd-bundles/*/; do python3 .reasonix/skills/pdd-protocol-author/scripts/check_bundle.py "$d"; done
      - name: Three-layer Validator Loop
        run: make all
      - name: Evidence chain verify
        run: python3 .reasonix/skills/pdd-evidence-keeper/scripts/evidence_chain.py verify evidence/user-registry/runtime-ledger.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: pdd-evidence, path: evidence/ }
