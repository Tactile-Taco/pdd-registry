name: pdd-release-gate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    env: { PDD_EVIDENCE_KEY: ${{ secrets.PDD_EVIDENCE_KEY }} }
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version: "3.12" }
      - run: pip install pyyaml pytest hypothesis jsonschema
      - name: All protocols sealed
        run: '! grep -rL "status: sealed" pdd-bundles/*/protocol.yaml && echo "all sealed"'
      - name: Validator loop green on this commit
        run: make all
      - name: Evidence chain verifies
        run: python3 .reasonix/skills/pdd-evidence-keeper/scripts/evidence_chain.py verify evidence/user-registry/runtime-ledger.jsonl
      - name: Attach evidence bundle to release
        run: tar czf pdd-evidence.tar.gz evidence/ && gh release upload "$GITHUB_REF_NAME" pdd-evidence.tar.gz --clobber
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
