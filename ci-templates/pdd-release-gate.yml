name: pdd-release-gate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.3 pytest==9.0.3 hypothesis==6.165.0 jsonschema==4.26.0
      - name: All protocols sealed
        run: '! grep -rL "status: sealed" pdd-bundles/*/protocol.yaml && echo "all sealed"'
      # make test runs the candidate suite under env -i (key never visible to
      # candidate code), then the service verification surface with the key.
      - name: Candidate suite (scrubbed) + service verification (key)
        run: make test
        env:
          PDD_EVIDENCE_KEY: ${{ secrets.PDD_EVIDENCE_KEY }}
      - name: Validator loop green on this commit
        run: make validate
      # Key scoped to evidence steps only.
      - name: Evidence chain build + verify
        run: make evidence
        env:
          PDD_EVIDENCE_KEY: ${{ secrets.PDD_EVIDENCE_KEY }}
      - name: Attach evidence bundle to release
        run: tar czf pdd-evidence.tar.gz evidence/ && gh release upload "$GITHUB_REF_NAME" pdd-evidence.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
