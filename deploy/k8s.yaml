# Applied on the staging cluster (k3s) via deploy/push.sh (or the staging-deploy CI).
# Traefik (bundled with k3s) routes by the Ingress host rule.
# Keep the port in sync with flake.nix (PORT env / ExposedPorts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdd-repository
  labels:
    app: pdd-repository
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdd-repository
  template:
    metadata:
      labels:
        app: pdd-repository
    spec:
      containers:
        - name: pdd-repository
          image: ghcr.io/tactile-taco/pdd-repository@sha256:c92ae4d042f55e4ee5260ae812dbfaf7a1fb9903c0ffba294b36560f3bbd9803
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # PDD_EVIDENCE_KEY comes from the cluster Secret created at deploy
            # time (source: Infisical). Never put the key in this file.
            - name: PDD_EVIDENCE_KEY
              valueFrom:
                secretKeyRef:
                  name: pdd-evidence-key
                  key: PDD_EVIDENCE_KEY
                  optional: true
            # v1.2 DB-backed registry: the catalog + evidence records are
            # served from PostgreSQL (S-006). The full URL (with password)
            # lives in the pdd-postgres Secret, created idempotently by
            # push.sh. Required: DB mode is the v1.2 deployment posture; a
            # missing Secret fails the deploy loudly instead of silently
            # serving the legacy filesystem catalog.
            - name: PDD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pdd-postgres
                  key: PDD_DATABASE_URL
                  optional: false
            # MCP surface (pdd-registry-mcp Phase A): /mcp delegates the
            # registry-facing tools to this same pod's REST API.
            - name: PDD_REGISTRY_URL
              value: "pdd+http://localhost:8080"
            # MCP Phase B: admin bearer for registry.admin.* tools
            # (token.mint/revoke). Created idempotently by push.sh.
            - name: PDD_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pdd-admin-token
                  key: PDD_ADMIN_TOKEN
                  optional: false
            # Publish authn (POST /publish bearer token; the in-cluster seed
            # sends it via this env). Created idempotently by push.sh.
            - name: PDD_PUBLISH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pdd-publish-token
                  key: PDD_PUBLISH_TOKEN
                  optional: false
---
apiVersion: v1
kind: Service
metadata:
  name: pdd-repository
spec:
  selector:
    app: pdd-repository
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdd-repository
spec:
  ingressClassName: traefik
  rules:
    - host: __STAGING_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pdd-repository
                port:
                  number: 8080
