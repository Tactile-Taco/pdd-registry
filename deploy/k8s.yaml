# Applied on the staging cluster (k3s) via deploy/push.sh (or the staging-deploy CI).
# Traefik (bundled with k3s) routes by the Ingress host rule.
# Keep the port in sync with flake.nix (PORT env / ExposedPorts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdd-registry
  labels:
    app: pdd-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdd-registry
  template:
    metadata:
      labels:
        app: pdd-registry
    spec:
      initContainers:
        # Seed the persistent data volume from the image once (no-clobber:
        # append-only ledgers and published admissions on the volume survive
        # rollouts; new committed evidence files appear on the next boot).
        - name: pdd-seed
          image: ghcr.io/tactile-taco/pdd-registry@sha256:c92ae4d042f55e4ee5260ae812dbfaf7a1fb9903c0ffba294b36560f3bbd9803
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /data/evidence /data/published
              cp -rn /opt/pdd/evidence/. /data/evidence/ 2>/dev/null || true
              cp -rn /opt/pdd/published/. /data/published/ 2>/dev/null || true
              echo "seeded $(find /data/evidence -type f | wc -l) evidence files"
          volumeMounts:
            - name: pdd-data
              mountPath: /data
      containers:
        - name: pdd-registry
          image: ghcr.io/tactile-taco/pdd-registry@sha256:c92ae4d042f55e4ee5260ae812dbfaf7a1fb9903c0ffba294b36560f3bbd9803
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # PDD_EVIDENCE_KEY comes from the cluster Secret created at deploy
            # time (source: Infisical). Never put the key in this file.
            - name: PDD_EVIDENCE_KEY
              valueFrom:
                secretKeyRef:
                  name: pdd-evidence-key
                  key: PDD_EVIDENCE_KEY
                  optional: true
            # PDD_PUBLISH_TOKEN authorizes POST /publish (created at deploy time).
            - name: PDD_PUBLISH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pdd-publish-token
                  key: PDD_PUBLISH_TOKEN
                  optional: true
            # Runtime-written data on the persistent volume (rollouts survive).
            - name: PDD_DATA_DIR
              value: /data
          volumeMounts:
            - name: pdd-data
              mountPath: /data
      volumes:
        - name: pdd-data
          persistentVolumeClaim:
            claimName: pdd-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pdd-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # k3s local-path provisioner (host disk on the staging guest).
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: pdd-registry
spec:
  selector:
    app: pdd-registry
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdd-registry
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - __STAGING_HOST__
      secretName: pdd-tls
  rules:
    - host: __STAGING_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pdd-registry
                port:
                  number: 8080
