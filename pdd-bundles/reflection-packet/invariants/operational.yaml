operational_invariants:
  - id: capability-manifest-conformance
    statement: Runtime authority and resource usage must conform to capability-manifest.yaml.
    severity: must
    infra_assumption: sandbox or runtime instrumentation (enforced by sandbox policy check)
    validation:
      - sandbox_policy_check
      - runtime_instrumentation

  - id: no-network
    statement: The packet builder must not initiate outbound network connections.
    severity: must
    validation:
      - sandbox_network_denial

  - id: no-model-calls
    statement: The packet builder must not call any language model — assembly is mechanical (narrative content comes from the topic-flow-review pass, not the builder).
    severity: must
    validation:
      - sandbox_network_denial
      - runtime_instrumentation

  - id: packet-output-only
    statement: The builder may read the archive, chunk store, and annotation store but may only write the packet artifact under the packet-output path (never the archive).
    severity: must
    validation:
      - filesystem_trace

  - id: memory-budget
    statement: Peak memory must stay under 1 GB while building packets for the largest archived files.
    severity: should
    infra_assumption: benchmark harness; measured, recorded as observation
    validation:
      - memory_profile

  - id: latency-budget
    statement: p95 build latency must remain under 30 s per file.
    severity: should
    infra_assumption: benchmark harness; measured, recorded as observation
    validation:
      - benchmark
