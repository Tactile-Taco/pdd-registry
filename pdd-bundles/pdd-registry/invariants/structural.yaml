structural_invariants:
  - id: S-001
    statement: >
      Search requests and responses must conform to their referenced JSON
      Schemas (schemas/request.schema.json, schemas/response.schema.json),
      including additionalProperties:false strictness.
    severity: must
    validation:
      - json_schema_validation
      - contract_tests

  - id: S-002
    statement: >
      All failures must return the stable error envelope with a kind from the
      enumerated set {invalid_request, not_found, internal} and a
      human-readable message.
    severity: must
    validation:
      - contract_tests

  - id: S-003
    statement: >
      Handshake versioning: minor versions may add optional fields only; no
      field may be removed, renamed, or made required within the same major
      version.
    severity: must
    validation:
      - schema_diff_check

  - id: S-004
    statement: >
      Catalog addressing: every catalog entry must declare a kebab-case
      namespace; bundle names are unique within a namespace, so the catalog
      must never contain two entries with the same (namespace, name) pair.
      The display address is namespace/name; the on-disk directory
      (pdd-bundles/<name>) and evidence stay name-keyed (backwards-compatible
      bridge, no directory reorganization).
    severity: must
    validation:
      - linter
      - contract_tests

  - id: S-005
    statement: >
      Tag grammar: tags come from the controlled catalog vocabulary and each
      tag is kebab-case; at most 8 tags per bundle, no duplicates. Filtering
      by tag is exact membership.
    severity: must
    validation:
      - linter
      - contract_tests

  - id: S-006
    statement: >
      DB-backed storage: the registry catalog and evidence records are
      persisted in the backing database (PostgreSQL deployment surface); reads
      are transactionally consistent — a query observes a committed snapshot
      and never partial state. Serving does not require the on-disk bundle
      layout. The attested candidate remains the pure in-memory core; the
      database adapter is deployment surface.
    severity: must
    validation:
      - contract_tests

  - id: S-007
    statement: >
      Evidence provenance: every admission evidence record stored by the
      registry carries a resource_identifier (an http(s) URL or URN) pointing
      at the protocol author's validator-loop execution record (e.g. a CI/CD
      results page). The registry does not re-run validation; verification of
      the record is limited to presence, format, and signature — the honor
      system for this version.
    severity: must
    validation:
      - contract_tests

  - id: S-008
    statement: >
      Evidence freshness: the latest admission evidence for a bundle must
      attest the bundle's CURRENT on-disk digest. Any change to the bundle
      directory (protocol.yaml, invariants, schemas, capability/validator
      manifests) without re-validation and re-attestation is a violation:
      the migrated registry record would then be paired with evidence that
      attests a different snapshot.
    severity: must
    validation:
      - staleness_gate   # keyless `pdd evidence staleness`; wired into
                         # make all + pdd-pr-gates + pdd-validator-loop CI

  - id: S-009
    statement: >
      Registry-side ledger durability and append-only: ledger blocks are
      persisted in the backing database and are append-only — existing
      blocks are never modified, deleted, or reordered; the hash-chained
      block digest detects any tampering; a write that would alter a prior
      block must fail.
    severity: must
    validation:
      - contract_tests   # src/tests/test_registry_db.py: tamper/delete/
                         # reorder a stored ledger block via raw SQL and
                         # assert the chain verification detects it; the
                         # adapter's ledger surface exposes no update/
                         # delete path (only append)

  - id: S-010
    statement: >
      Version-event preservation (lossless migration): publishing a new
      version or bundle_digest for an existing (namespace, name) must
      preserve the prior version's catalog record, its evidence rows, and
      its ledger blocks — prior versions remain queryable and verifiable;
      nothing is overwritten or deleted.
    severity: must
    validation:
      - contract_tests   # src/tests/test_registry_db.py: publish one
                         # version then a new version/digest of the same
                         # (namespace, name) and assert BOTH catalog
                         # records, both evidence rows, and both ledger
                         # blocks survive; the prior admission still
                         # verifies in the chain
