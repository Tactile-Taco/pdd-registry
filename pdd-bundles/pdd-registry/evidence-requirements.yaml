evidence_requirements:
  required:
    - protocol_version
    - implementation_artifact_hash
    - validator_versions
    - validation_results
    - dependency_manifest
    - discovery_log
    - resource_identifier   # S-007 (v1.2.0): URL/URN of the author's
                            # validator-loop execution record (honor system)
    - freshness             # S-008 (v1.3.0): the latest admission must
                            # attest the current on-disk bundle digest
                            # (keyless `pdd evidence staleness` gate)
    - ledger_append_only    # S-009 (v1.4.0): registry-side ledger blocks are
                            # persisted in the backing database, append-only,
                            # tamper-detected by the hash-chained digest
    - version_preservation  # S-010 (v1.4.0): a re-publish (new version or
                            # bundle_digest) preserves the prior version's
                            # catalog record, evidence rows, and ledger blocks
  attestations:
    signed: true
    signer: evidence-keeper (HMAC-SHA256, production PDD_EVIDENCE_KEY from Infisical, nixos-infra project)
  replay:
    deterministic_replay_required: true
    required_environment_metadata:
      - runtime
      - operating_system
      - dependency_lockfile
