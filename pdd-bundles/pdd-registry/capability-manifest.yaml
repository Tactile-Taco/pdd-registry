capabilities:
  network:
    outbound_allowed: false
    allowed_destinations: []
  filesystem:
    read_allowed: false
    write_allowed: false
    allowed_paths: []
  database:
    allowed: true
    engine: "in-memory catalog for the attested candidate (caller-supplied);
      PostgreSQL-backed store for the deployment surface (v1.2: catalog +
      evidence records persisted via the publish handshake; the candidate
      itself never persists)"
    max_reads_per_request: null
    max_writes_per_request: 0    # the candidate writes nothing; publishes are
                                 # handled by the deployment surface, not the
                                 # attested core
  secrets:
    allowed_environment_variables: []
  resources:
    max_latency_ms: 500        # severity: should (advisory budget)
    max_memory_mb: 64          # severity: should (advisory budget)
    max_cpu_ms: null
    max_concurrency: 1
  background_work:
    allowed: false
  telemetry:
    required_fields:
      - protocol_version
