protocol:
  name: pdd-registry
  version: 1.1.0
  status: sealed

# Catalog addressing metadata (v1.1 version event): namespace/name display
# addressing + controlled tag vocabulary. The on-disk directory stays
# pdd-bundles/<name> and evidence stays name-keyed — this is a
# backwards-compatible bridge, not a directory reorganization.
namespace: pdd
tags: [engine, data-catalog, server]

purpose: >
  Protocol catalog search and read views. Given an in-memory catalog of sealed
  protocol bundles (the shape pdd-bundles/* produces), the registry answers
  ranked keyword search, filtered bundle listing, and per-bundle views
  (summary, invariants, capabilities) — deterministically and without
  mutating the catalog.

boundary:
  in_scope:
    - Ranked keyword search over catalog entries (name, purpose, invariants, capabilities, tags)
    - Filtered bundle listing (exact status, depends_on membership, namespace, tag)
    - "Namespace/tag metadata: every catalog entry carries a kebab-case namespace and a controlled tag vocabulary; addressing is namespace/name (display) while directories and evidence stay name-keyed"
    - Per-bundle views: summary, invariants (severity-filtered), capabilities
    - Deterministic ordering and strictly non-mutating reads
  out_of_scope:
    - HTTP transport and deployment wiring (src/server.py + src/registry_index.py
      are the production surface; the attested candidate is the pure in-memory core)
    - Authentication, authorization
    - Write paths (sealing, evidence signing) — git + CLI, never via the registry core
    - Filesystem access and persistence — the candidate operates on an
      in-memory catalog supplied by the caller

handshakes:
  request_schema: schemas/request.schema.json
  response_schema: schemas/response.schema.json

depends_on: []
provides:
  pdd-registry.search: schemas/request.schema.json
  pdd-registry.bundle-views: schemas/response.schema.json

invariants:
  structural: invariants/structural.yaml
  behavioral: invariants/behavioral.yaml
  operational: invariants/operational.yaml

capabilities: capability-manifest.yaml
validators: validators/validation-plan.yaml
evidence: evidence-requirements.yaml
