structural_invariants:
  - id: S-001
    statement: >
      TEMPLATE (should): tool-call envelope — external tool invocations
      should use a stable envelope (tool name, typed arguments, result
      status) that the tool-runtime can route and audit.
    severity: should
    validation:
      - template

  - id: S-002
    statement: >
      TEMPLATE (should): context boundary — the context window should be
      an explicit, bounded resource: what enters it, what is evicted, and
      what is never allowed in (secrets, PII without purpose) should be
      stated.
    severity: should
    validation:
      - template

  - id: S-003
    statement: >
      TEMPLATE (should): guardrail ordering — safety/guardrail checks
      should run before consequential actions (publish, write, external
      side effects), not after.
    severity: should
    validation:
      - template

  - id: S-004
    statement: >
      TEMPLATE (should): provenance — every agent-produced artifact or
      action should carry provenance (which skill/tool/model produced it,
      when, from what inputs) so the registry's evidence discipline can
      be extended to agent behavior.
    severity: should
    validation:
      - template

  - id: S-005
    statement: >
      TEMPLATE (should): component mapping — a conforming bundle should
      map every declared component to this vocabulary (or the composed
      web-service vocabulary), with documented overrides for inventions.
    severity: should
    validation:
      - template
      - contract_tests
