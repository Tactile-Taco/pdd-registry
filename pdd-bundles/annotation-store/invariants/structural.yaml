structural_invariants:
  - id: schema-conformance
    statement: All append, query, and render requests and responses must conform to their referenced JSON Schemas.
    severity: must
    validation:
      - json_schema_validation

  - id: unique-annotation-ids
    statement: annotation_id must be unique across the whole store (not just within a batch or a file).
    severity: must
    validation:
      - contract_tests

  - id: address-integrity
    statement: Every target must reference an archived transcript (source + filename that exists in the archive) and, when chunk_id is present, a chunk that exists in that transcript's chunk map.
    severity: must
    validation:
      - contract_tests
