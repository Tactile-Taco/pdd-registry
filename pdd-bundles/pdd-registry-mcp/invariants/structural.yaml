structural_invariants:
  - id: S-001
    statement: >
      Surface conformance: the served tool set (tools/list) must equal the
      tool-registry schema's enumerated tool names with their declared
      inputSchemas, and the served resource set (resources/list) must equal
      the resource-registry schema's set. additionalProperties:false
      strictness applies.
    severity: must
    validation:
      - contract_tests
      - linter

  - id: S-002
    statement: >
      Error envelope: all failures must return the MCP JSON-RPC error shape
      (error.schema.json) with a code from the enumerated set and a
      data.kind from {invalid_request, not_found, internal}; no failure
      may leak internals beyond data.detail.
    severity: must
    validation:
      - contract_tests

  - id: S-003
    statement: >
      Handshake versioning: minor versions may add optional tools,
      resources, or fields only; no tool, resource, or field may be
      removed, renamed, or made required within the same major version.
    severity: must
    validation:
      - schema_diff_check

  - id: S-004
    statement: >
      Surface freshness: the served surface must derive from the CURRENT
      sealed bundle digest. The server refuses to serve (startup check)
      when the on-disk bundle digest differs from the digest attested by
      the latest admission evidence — the keyless staleness gate applied
      to this bundle itself.
    severity: must
    validation:
      - staleness_gate
      - contract_tests
