structural_invariants:
  - id: schema-conformance
    statement: Requests and responses must conform to their referenced JSON Schemas.
    severity: must
    validation:
      - json_schema_validation

  - id: relation-type-enum
    statement: Every intra_session edge relation and every finding kind must be one of the enumerated values.
    severity: must
    validation:
      - json_schema_validation

  - id: record-conformance
    statement: Every produced annotation record must conform to the annotation-store append envelope schema (via depends_on annotation-store).
    severity: must
    validation:
      - contract_tests

  - id: finding-reference-valid
    statement: Every finding's supporting_refs must reference annotation ids present in the session's consumed layers, and every intra_session edge must reference topic ids that exist in the session's topic index.
    severity: must
    validation:
      - contract_tests
