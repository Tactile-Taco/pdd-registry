operational_invariants:
  - id: capability-manifest-conformance
    statement: Runtime authority and resource usage must conform to capability-manifest.yaml.
    severity: must
    infra_assumption: sandbox or runtime instrumentation (enforced by sandbox policy check)
    validation:
      - sandbox_policy_check
      - runtime_instrumentation

  - id: no-network
    statement: The chunking pass must not initiate outbound network connections.
    severity: must
    validation:
      - sandbox_network_denial

  - id: no-model-calls
    statement: The chunking pass must not call any language model (free or paid) — it is a zero-cost mechanical pass.
    severity: must
    validation:
      - sandbox_network_denial
      - runtime_instrumentation

  - id: archive-read-only
    statement: The pass may read the transcript archive but must never write to it; writes are confined to the chunk-store output path.
    severity: must
    validation:
      - filesystem_trace

  - id: memory-budget
    statement: Peak memory must stay under 1 GB while chunking the largest archived files (22 MB raw).
    severity: should
    infra_assumption: benchmark harness; measured, recorded as observation
    validation:
      - memory_profile

  - id: latency-budget
    statement: p95 chunking latency must remain under 30 s per file on the reference workstation.
    severity: should
    infra_assumption: benchmark harness; measured, recorded as observation
    validation:
      - benchmark
