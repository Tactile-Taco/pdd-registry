capabilities:
  network:
    outbound_allowed: false
    allowed_destinations: []
  filesystem:
    read_allowed: true
    write_allowed: false
    allowed_paths:
      - /home/tacticaltaco/transcript-archive/**   # READ-ONLY source
      - <chunk-store>/**                             # READ-ONLY render + chunk map
  database:
    allowed: false
    max_reads_per_request: 0
    max_writes_per_request: 0
  secrets:
    allowed_environment_variables: []
  resources:
    max_latency_ms: 30000
    max_memory_mb: 512
    max_cpu_ms: null
    max_concurrency: 1
  background_work:
    allowed: false
  telemetry:
    required_fields:
      - correlation_id
      - protocol_version
