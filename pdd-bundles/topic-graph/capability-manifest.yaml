capabilities:
  network:
    outbound_allowed: true
    allowed_destinations:
      - "<local-embedding-service>"   # local embeddings only; no generative LLM
  filesystem:
    read_allowed: true
    write_allowed: true
    allowed_paths:
      - <graph-store>/**      # the persistent topic graph index (the only writable path)
      - <annotation-store>/** # READ-ONLY consumed topic layer
  database:
    allowed: false
    max_reads_per_request: 0
    max_writes_per_request: 0
  secrets:
    allowed_environment_variables: []
  resources:
    max_latency_ms: 30000
    max_memory_mb: 4096
    max_cpu_ms: null
    max_concurrency: 1
  background_work:
    allowed: false
  telemetry:
    required_fields:
      - correlation_id
      - protocol_version
      - index_size
