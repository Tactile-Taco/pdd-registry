name: pdd-nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  deep-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.3 pytest==9.0.3 hypothesis==6.165.0 jsonschema==4.26.0
      - name: Extended property runs (>=5000 cases)
        run: PBT_RUNS=5000 python3 validators/validate_candidate.py pdd-bundles/user-registry implementations/user-registry/python-stdlib --pbt-runs 5000
      - name: Candidate suite (scrubbed) + service verification (key)
        run: make test
        env:
          PDD_EVIDENCE_KEY: ${{ secrets.PDD_EVIDENCE_KEY }}
      - name: Evidence chain verify
        run: python3 .reasonix/skills/pdd-evidence-keeper/scripts/evidence_chain.py verify evidence/user-registry/runtime-ledger.jsonl
        env:
          PDD_EVIDENCE_KEY: ${{ secrets.PDD_EVIDENCE_KEY }}
      - name: Open issue on failure
        if: failure()
        run: gh issue create --title "nightly pdd failure $(date +%F)" --body "see run $GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
