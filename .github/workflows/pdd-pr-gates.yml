name: pdd-pr-gates
on:
  pull_request:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.3
      - name: Bundle lint
        run: for d in pdd-bundles/*/; do python3 .reasonix/skills/pdd-protocol-author/scripts/check_bundle.py "$d"; done
      - name: Cross-bundle compatibility
        run: python3 .reasonix/skills/pdd-contract-negotiator/scripts/check_compatibility.py pdd-bundles/
      # The fleet is a client system outside the PDD loop (stochastic agents);
      # its deterministic parts gate PRs here.
      - name: Memory-plane fleet tests
        run: python3 -m pytest memory-plane/tests/ -q
